<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云栖空间 · 欢迎</title>
<meta name="description" content="云栖空间入口——致明天，亦或者是千年后的你。">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:MiSans,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    overflow:hidden;color:#fff;-webkit-font-smoothing:antialiased}

  /* ===== 全屏背景（视差层） ===== */
  .bg{position:fixed;inset:-3%;width:106%;height:106%;
    background:url("bg-moon-ccw.jpg") center 42%/cover no-repeat;
    will-change:transform}
  .veil{position:fixed;inset:0;
    background:
      radial-gradient(ellipse 70% 60% at 50% 46%,rgba(16,12,34,.18),transparent 70%),
      linear-gradient(180deg,rgba(16,12,34,.34) 0%,rgba(16,12,34,.08) 34%,rgba(16,12,34,.10) 62%,rgba(16,12,34,.52) 100%)}

  /* ===== 飘落花瓣（视差层容器） ===== */
  .petals{position:fixed;inset:0;z-index:3;pointer-events:none;will-change:transform}
  .petal{position:absolute;top:-4vh;border-radius:80% 0 80% 0;pointer-events:none;
    background:linear-gradient(135deg,#ffd7e4,#f7a8c4);opacity:.85;
    animation:fall linear infinite}
  @keyframes fall{
    0%{transform:translate3d(0,-4vh,0) rotate(0deg);opacity:0}
    8%{opacity:.85}
    100%{transform:translate3d(var(--sway),104vh,0) rotate(560deg);opacity:.35}}

  /* ===== 左上角品牌 ===== */
  .brand{position:fixed;top:26px;left:30px;z-index:10;display:flex;align-items:center;gap:11px;
    text-decoration:none;color:#fff;will-change:transform}
  .brand img{width:42px;height:42px;border-radius:50%;object-fit:cover;
    border:2px solid rgba(255,255,255,.55);box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .brand b{font-size:16.5px;letter-spacing:2px;text-shadow:0 2px 10px rgba(0,0,0,.5)}

  /* ===== 中央内容 ===== */
  .stage{position:relative;z-index:5;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:0 24px;will-change:transform}
  .en{font-size:13px;letter-spacing:7px;color:rgba(255,255,255,.82);
    text-shadow:0 2px 12px rgba(0,0,0,.45);margin-bottom:18px;animation:rise .9s .15s both}
  h1{font-family:"Source Han Serif SC","Noto Serif SC","Songti SC",serif;
    font-size:clamp(52px,9vw,96px);font-weight:700;letter-spacing:22px;text-indent:22px;
    text-shadow:0 6px 30px rgba(0,0,0,.45);animation:rise .9s .3s both}
  .orn{display:flex;align-items:center;gap:14px;margin:20px 0 18px;animation:rise .9s .45s both}
  .orn::before,.orn::after{content:"";width:64px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent)}
  .orn span{font-size:15px;color:rgba(255,255,255,.85)}
  .slogan{font-size:clamp(16px,2.4vw,21px);letter-spacing:6px;color:rgba(255,255,255,.94);
    text-shadow:0 2px 14px rgba(0,0,0,.5);animation:rise .9s .55s both}
  .desc{margin-top:16px;font-size:14px;letter-spacing:2px;color:rgba(255,255,255,.72);
    text-shadow:0 2px 10px rgba(0,0,0,.5);animation:rise .9s .7s both}
  .enter{margin-top:42px;display:inline-flex;align-items:center;gap:10px;
    padding:16px 42px;border-radius:999px;text-decoration:none;
    background:linear-gradient(135deg,#f28bab,#e0628a);color:#fff;
    font-size:16.5px;font-weight:700;letter-spacing:3px;
    box-shadow:0 12px 32px rgba(224,98,138,.45),inset 0 1px 0 rgba(255,255,255,.35);
    transition:.25s cubic-bezier(.22,1,.36,1);animation:rise .9s .85s both}
  .enter:hover{transform:translateY(-3px) scale(1.03);
    box-shadow:0 18px 42px rgba(224,98,138,.55),inset 0 1px 0 rgba(255,255,255,.35)}
  .enter .dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.9);
    box-shadow:0 0 10px rgba(255,255,255,.9);animation:pulse 2s ease-in-out infinite}
  .enter .arr{transition:.25s}
  .enter:hover .arr{transform:translateX(5px)}
  @keyframes pulse{50%{opacity:.4}}
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

  /* ===== 底部小字 ===== */
  .fine{position:fixed;bottom:18px;left:0;right:0;z-index:5;text-align:center;
    font-size:11.5px;letter-spacing:1px;color:rgba(255,255,255,.5);
    text-shadow:0 1px 6px rgba(0,0,0,.5)}

  @media (max-width:560px){
    h1{letter-spacing:12px;text-indent:12px}
    .en{letter-spacing:4px}
    .slogan{letter-spacing:3px}
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="veil"></div>

<!-- 花瓣（包一层视差容器） -->
<div class="petals">
<span class="petal" style="left:6%;width:13px;height:11px;--sway:9vw;animation-duration:11s;animation-delay:-2s"></span>
<span class="petal" style="left:16%;width:10px;height:9px;--sway:-6vw;animation-duration:14s;animation-delay:-7s"></span>
<span class="petal" style="left:27%;width:14px;height:12px;--sway:7vw;animation-duration:12s;animation-delay:-4s"></span>
<span class="petal" style="left:39%;width:9px;height:8px;--sway:-9vw;animation-duration:16s;animation-delay:-9s"></span>
<span class="petal" style="left:52%;width:12px;height:10px;--sway:8vw;animation-duration:13s;animation-delay:-1s"></span>
<span class="petal" style="left:63%;width:10px;height:9px;--sway:-7vw;animation-duration:15s;animation-delay:-11s"></span>
<span class="petal" style="left:74%;width:14px;height:12px;--sway:6vw;animation-duration:11.5s;animation-delay:-5s"></span>
<span class="petal" style="left:85%;width:9px;height:8px;--sway:-8vw;animation-duration:17s;animation-delay:-13s"></span>
<span class="petal" style="left:93%;width:12px;height:10px;--sway:-5vw;animation-duration:12.5s;animation-delay:-8s"></span>
</div>

<a class="brand" href="welcome.html">
  <img src="avatar.jpg" alt="云栖">
  <b>云栖空间</b>
</a>

<main class="stage">
  <div class="en">YUNQI SPACE</div>
  <h1>云栖空间</h1>
  <div class="orn"><span>❀</span></div>
  <p class="slogan">致明天，亦或者是千年后的你</p>
  <p class="desc">逛作品、看回忆、留个言——这里收藏着一些小小的想法。</p>
  <a class="enter" href="index.html">
    <span class="dot"></span>进入云栖空间<span class="arr">→</span>
  </a>
</main>

<div class="fine">本站为个人非盈利主页，相关素材版权归原作者所有。</div>

<script>
/* ===== 鼠标视差景深 =====
   四层深度：背景动最多（远景），花瓣次之（中景），
   中央内容与品牌反向轻移（近景），惯性平滑跟随 */
(function(){
  const layers=[
    {el:document.querySelector('.bg'),    x:26, y:16, inv:1},
    {el:document.querySelector('.petals'),x:16, y:10, inv:1},
    {el:document.querySelector('.stage'), x:10, y:7,  inv:-1},
    {el:document.querySelector('.brand'), x:6,  y:4,  inv:-1}
  ];
  let tx=0,ty=0,cx=0,cy=0;
  addEventListener('mousemove',e=>{
    tx=(e.clientX/innerWidth-.5)*2;
    ty=(e.clientY/innerHeight-.5)*2;
  });
  // 触屏设备：轻微陀螺仪视差（可选，失败静默）
  addEventListener('deviceorientation',e=>{
    if(e.gamma==null)return;
    tx=Math.max(-1,Math.min(1,e.gamma/30));
    ty=Math.max(-1,Math.min(1,(e.beta-45)/30));
  });
  let t=0;
  (function tick(){
    t+=.005;
    cx+=(tx-cx)*.055; cy+=(ty-cy)*.055;
    // 叠加一丝呼吸浮动，画面不呆板
    const bx=Math.sin(t)*.06, by=Math.cos(t*.8)*.045;
    const px=cx+bx, py=cy+by;
    layers.forEach(l=>{
      l.el.style.transform='translate3d('+(px*l.x*l.inv).toFixed(2)+'px,'+(py*l.y*l.inv).toFixed(2)+'px,0)';
    });
    requestAnimationFrame(tick);
  })();
})();
</script>
</body>
</html>
