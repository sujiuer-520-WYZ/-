/* 背景视差 */
(function(){
  const bgImg = document.getElementById('siteBgImg');
  if (!bgImg) return;
  const maxX = 28, maxY = 18;
  let tx = 0, ty = 0, cx = 0, cy = 0;
  addEventListener('mousemove', e => {
    tx = (e.clientX / innerWidth - 0.5) * 2;
    ty = (e.clientY / innerHeight - 0.5) * 2;
  }, {passive:true});
  let t = 0;
  (function tick(){
    t += 0.005;
    cx += (tx - cx) * 0.055;
    cy += (ty - cy) * 0.055;
    const bx = Math.sin(t) * 0.05, by = Math.cos(t * 0.8) * 0.04;
    const px = (cx + bx) * maxX, py = (cy + by) * maxY;
    bgImg.style.transform = 'translate3d(' + px.toFixed(2) + 'px,' + py.toFixed(2) + 'px,0) scale(1.02)';
    requestAnimationFrame(tick);
  })();
})();

/* 音乐胶囊播放器驱动 */
(function(){
  const box = document.getElementById('navMusic');
  if(!box) return;
  const btn = document.getElementById('navMusicBtn'),
    disc = document.getElementById('navMusicDisc'),
    info = document.getElementById('navMusicInfo'),
    fill = document.getElementById('navMusicFill'),
    bar = document.getElementById('navMusicBar'),
    timeEl = document.getElementById('navMusicTime');

  const audio = new Audio('remember.mp3');
  audio.preload = 'metadata';
  audio.loop = true;

  function formatTime(s){
    if(isNaN(s)) return '0:00';
    const m = Math.floor(s / 60), r = Math.floor(s % 60);
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  function updateProgress(){
    const cur = audio.currentTime || 0;
    const dur = audio.duration || 196;
    timeEl.textContent = formatTime(cur);
    fill.style.width = (dur > 0 ? (cur / dur * 100).toFixed(1) : 0) + '%';
  }
  function setPlayingState(playing){
    box.classList.toggle('playing', playing);
    btn.innerHTML = playing
      ? '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1.5"/><rect x="14" y="4" width="4" height="16" rx="1.5"/></svg>'
      : '<svg viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"/></svg>';
  }
  function togglePlay(){
    if(audio.paused){
      audio.play().then(()=> setPlayingState(true)).catch(err=> console.warn(err));
    } else {
      audio.pause();
      setPlayingState(false);
    }
  }
  audio.addEventListener('timeupdate', updateProgress);
  audio.addEventListener('play', ()=> setPlayingState(true));
  audio.addEventListener('pause', ()=> setPlayingState(false));
  audio.addEventListener('loadedmetadata', updateProgress);

  btn.addEventListener('click', togglePlay);
  disc.addEventListener('click', togglePlay);
  info.addEventListener('click', togglePlay);
  if(bar){
    bar.addEventListener('click', e=>{
      e.stopPropagation();
      const rect = bar.getBoundingClientRect();
      const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const dur = audio.duration || 196;
      audio.currentTime = pos * dur;
      updateProgress();
    });
  }
})();

// 采用 IndexedDB（无限量、异步强持久化）+ LocalStorage（备份）双通道持久化驱动
const DB_NAME = 'YunqiGalleryDB';
const DB_VERSION = 1;
const STORE_NAME = 'photos';

function openPhotoDB(){
  return new Promise((resolve, reject) => {
    if(!window.indexedDB){
      resolve(null);
      return;
    }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = function(e){
      const db = e.target.result;
      if(!db.objectStoreNames.contains(STORE_NAME)){
        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  });
}

function loadPhotosFromDB(){
  return new Promise(async (resolve) => {
    try {
      const db = await openPhotoDB();
      if(!db){
        resolve(null);
        return;
      }
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => resolve(null);
    } catch(err){
      resolve(null);
    }
  });
}

function savePhotoToDB(item){
  return new Promise(async (resolve) => {
    try {
      const db = await openPhotoDB();
      if(!db) return resolve(false);
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      store.put(item);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    } catch(err){
      resolve(false);
    }
  });
}

function removePhotoFromDB(id){
  return new Promise(async (resolve) => {
    try {
      const db = await openPhotoDB();
      if(!db) return resolve(false);
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      store.delete(id);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    } catch(err){
      resolve(false);
    }
  });
}

// 初始化加载图库数据（优先 IndexedDB，降级 LocalStorage）
async function initGalleryData(){
  let userUploads = null;
  // 1. 尝试从 IndexedDB 加载
  const dbData = await loadPhotosFromDB();
  if (Array.isArray(dbData) && dbData.length > 0) {
    userUploads = dbData;
  } else {
    // 2. 尝试从 localStorage 迁移或读取
    try {
      const raw = localStorage.getItem('yunqi_gallery_user_uploads');
      if (raw) {
        userUploads = JSON.parse(raw);
        // 同步回迁进 IndexedDB
        if(Array.isArray(userUploads)){
          userUploads.forEach(p => savePhotoToDB(p));
        }
      }
    } catch(e){
      console.warn('读取本地 LocalStorage 受限:', e);
    }
  }

  if (Array.isArray(userUploads) && userUploads.length > 0) {
    // 过滤掉已经在默认列表中的重复项
    const defaultIds = new Set(DEFAULT_ITEMS.map(x => x.id));
    const validUploads = userUploads.filter(x => !defaultIds.has(x.id));
    galleryItems = validUploads.concat(DEFAULT_ITEMS);
  } else {
    galleryItems = DEFAULT_ITEMS.slice();
  }
  renderGallery();
}

function saveUserUploads(){
  const userUploads = galleryItems.filter(x => x.isMine);
  // 双通道存储
  userUploads.forEach(item => savePhotoToDB(item));
  try {
    localStorage.setItem('yunqi_gallery_user_uploads', JSON.stringify(userUploads));
  } catch(e){
    // 当图片量大超出5MB时，LocalStorage会静默报错，但 IndexedDB 毫发无损！
    console.info('LocalStorage超出配额，已由 IndexedDB 保障永久保存');
  }
}
initGalleryData();

  t.textContent = msg;
  t.classList.add('on');
  setTimeout(()=> t.classList.remove('on'), 1800);
}

// 渲染图库列表
function renderGallery(){
  let list = galleryItems.slice();

  if (myGalleryOnly) {
    list = list.filter(item => item.isMine);
  }

  if (currentFilterTag !== 'all') {
    list = list.filter(item => item.tag === currentFilterTag);
  }

  if (currentSearchQuery) {
    const q = currentSearchQuery.toLowerCase();
    list = list.filter(item => 
      (item.title && item.title.toLowerCase().includes(q)) ||
      (item.tag && item.tag.toLowerCase().includes(q)) ||
      (item.user && item.user.toLowerCase().includes(q))
    );
  }

  if (currentSort === 'newest') {
    list.sort((a,b) => b.time - a.time);
  } else if (currentSort === 'popular') {
    list.sort((a,b) => b.likes - a.likes);
  } else if (currentSort === 'name') {
    list.sort((a,b) => (a.title || '').localeCompare(b.title || ''));
  }

  countEl.textContent = '共 ' + list.length + ' 张图片';

  if (list.length === 0) {
    gridEl.innerHTML = '';
    emptyEl.classList.add('show');
    return;
  }
  emptyEl.classList.remove('show');

  gridEl.innerHTML = list.map(item => `
    <div class="gallery-card" data-id="${item.id}">
      <div class="gallery-card-thumb" onclick="openLightbox('${item.src}', '${escapeHtml(item.title)}')">
        <img src="${item.src}" alt="${escapeHtml(item.title)}" loading="lazy">
        <span class="gallery-card-tag">${escapeHtml(item.tag)}</span>
      </div>
      <div class="gallery-card-body">
        <div class="gallery-card-title" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</div>
        <div class="gallery-card-meta">
          <div class="gallery-user">
            <img class="gallery-user-avatar" src="${item.avatar || 'avatar.jpg'}" alt="头像">
            <span class="gallery-user-name">${escapeHtml(item.user || '云栖')}</span>
            <span class="gallery-user-badge">${escapeHtml(item.badge || 'Lv.1')}</span>
          </div>
          <span class="gallery-card-ratio">${item.ratio || '10 / 19'}</span>
        </div>
        <div class="gallery-card-footer">
          <button class="gallery-like-btn ${item.liked ? 'liked' : ''}" onclick="toggleLike('${item.id}')">
            <span>${item.liked ? '❤️' : '🤍'}</span>
            <span>点赞 ${item.likes || 0}</span>
          </button>
          ${item.isMine ? `<button class="gallery-del-btn" onclick="deleteItem('${item.id}')" title="删除此照片">🗑️</button>` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

function escapeHtml(str){
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

window.toggleLike = function(id){
  const item = galleryItems.find(x => x.id === id);
  if (!item) return;
  item.liked = !item.liked;
  item.likes = (item.likes || 0) + (item.liked ? 1 : -1);
  saveUserUploads();
  renderGallery();
  toast(item.liked ? '点赞成功 ❤️' : '已取消点赞');
};

window.deleteItem = function(id){
  if (!confirm('确定要从图库中删除这张图片吗？')) return;
  galleryItems = galleryItems.filter(x => x.id !== id);
  saveUserUploads();
  renderGallery();
  toast('已删除照片');
};

btnUploadModal.addEventListener('click', openUploadModal);
closeUploadModal.addEventListener('click', hideUploadModal);
cancelUpload.addEventListener('click', hideUploadModal);

dropzone.addEventListener('click', ()=> fileInput.click());
const btnChooseFile = document.getElementById('btnChooseFile');
if (btnChooseFile) {
  btnChooseFile.addEventListener('click', ()=> fileInput.click());
}

['dragenter', 'dragover'].forEach(name =>{
  dropzone.addEventListener(name, e=>{
    e.preventDefault();
    dropzone.classList.add('dragover');
  });
});
['dragleave', 'drop'].forEach(name =>{
  dropzone.addEventListener(name, e=>{
    e.preventDefault();
    dropzone.classList.remove('dragover');
  });
});
dropzone.addEventListener('drop', e=>{
  const files = e.dataTransfer.files;
  if(files && files[0]){
    handleFile(files[0]);
  }
});
fileInput.addEventListener('change', e=>{
  if(e.target.files && e.target.files[0]){
    handleFile(e.target.files[0]);
  }
});

// 图像压缩处理（将大图智能缩放至合理规格，彻底避免超大 Base64 导致的浏览器卡死或存储超限）
function compressImage(file, maxWidth, maxHeight, quality, callback){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      let w = img.width, h = img.height;
      if (w > maxWidth || h > maxHeight) {
        if (w / h > maxWidth / maxHeight) {
          h = Math.round(h * (maxWidth / w));
          w = maxWidth;
        } else {
          w = Math.round(w * (maxHeight / h));
          h = maxHeight;
        }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', quality || 0.85);
      callback(dataUrl, w, h);
    };
    img.onerror = function(){
      // 容错直接返回原 base64
      callback(e.target.result, 1920, 1080);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function handleFile(file){
  if(!file.type.startsWith('image/')){
    alert('请上传图片格式文件（如 JPG、PNG、WebP 等）');
    return;
  }
  toast('正在读取照片…');
  compressImage(file, 1600, 1200, 0.88, function(dataUrl, w, h){
    uploadedImageDataUrl = dataUrl;
    previewImg.src = uploadedImageDataUrl;
    previewImg.style.display = 'block';
    dropzone.style.display = 'none';
    if(!imgTitleInput.value){
      imgTitleInput.value = file.name.replace(/\.[^/.]+$/, "");
    }
    toast('照片加载完成，点击确认即可加入图库');
  });
}

confirmUpload.addEventListener('click', ()=>{
  if(!uploadedImageDataUrl){
    alert('请先选择或拖拽一张要上传的照片');
    return;
  }
  const title = imgTitleInput.value.trim() || ('IMG_' + Date.now());
  const tag = imgTagSelect.value || '壁纸';

  const newItem = {
    id: 'user-' + Date.now(),
    title: title,
    src: uploadedImageDataUrl,
    tag: tag,
    user: '云栖',
    badge: 'Lv.9',
    avatar: 'avatar.jpg',
    ratio: '16 / 9',
    likes: 1,
    liked: true,
    isMine: true,
    time: Date.now()
  };

  galleryItems.unshift(newItem);
  saveUserUploads();
  renderGallery();
  hideUploadModal();
  toast('照片上传成功，已收录进图库！');
});

/* ===== 大图灯箱 Lightbox ===== */
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxCaption = document.getElementById('lightboxCaption');
const closeLightbox = document.getElementById('closeLightbox');

window.openLightbox = function(src, caption){
  lightboxImg.src = src;
  lightboxCaption.textContent = caption || '';
  lightbox.classList.add('show');
};

function hideLightbox(){
  lightbox.classList.remove('show');
}
closeLightbox.addEventListener('click', hideLightbox);
lightbox.addEventListener('click', e=>{
  if(e.target === lightbox) hideLightbox();
});
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape') hideLightbox();
});

// 初始化渲染
renderGallery();
</script>
